spring:
  profiles:
    active:
      - db
  application:
    name: Kayaan-Backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  # Gmail SMTP Configuration for Password Reset
  # ใช้ Gmail App Password (ไม่ใช่รหัสผ่านปกติ)
  # ตั้งค่าใน environment variables: MAIL_USERNAME และ MAIL_PASSWORD
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  
  datasource:
    url: jdbc:mysql://localhost:3307/kayaan_db?createDatabaseIfNotExist=true&autoReconnect=true&characterEncoding=UTF-8&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: password
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        ddl-auto: update
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    repair-on-migrate: true
    clean-disabled: false
    validate-on-migrate: false

# Error handling configuration
server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# Logging configuration for debugging
logging:
  level:
    org.springframework.web: INFO
    org.springframework.validation: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: INFO
    org.springframework.security: INFO
    se499.kayaanbackend.controller.AvatarController: INFO
    se499.kayaanbackend.Manual_Generate: INFO
    se499.kayaanbackend.Manual_Generate.controller: INFO
    se499.kayaanbackend.Manual_Generate.service: INFO
    # Reduce verbose logging for better performance
    org.hibernate.SQL: false
    org.hibernate.type.descriptor.sql.BasicBinder: false

application:
  security:
    jwt:
      secret-key: ${APPLICATION_SECURITY_JWT_SECRET_KEY:}
      expiration: 86400000
      refresh-token:
        expiration: 604800000

# Supabase Configuration
supabase:
  url: ${SUPABASE_URL:https://ljapyahphaohoanshamz.supabase.co}
  serviceKey: ${SUPABASE_SERVICE_KEY:}
  buckets:
    avatars: ${SUPABASE_BUCKET_AVATARS:avatars}
    ai: ${SUPABASE_BUCKET_AI:ai-outputs}
    library: ${SUPABASE_BUCKET_LIBRARY:library}
  realtime:
    enabled: false
    groupChannelPrefix: groups.

avatar:
  upload-dir: ${user.dir}/uploads/avatars

# AI Configuration
ai:
  openai:
    api-key: ${OPENAI_API_KEY:}

    model: ${OPENAI_MODEL:gpt-3.5-turbo}
    max-tokens: ${OPENAI_MAX_TOKENS:600}
    temperature: ${OPENAI_TEMPERATURE:0.1}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
  
  generation:
    rate-limit:
      max-requests-per-hour: 5
      max-requests-per-minute: 3
      max-requests-per-day: 50
      max-templates-per-user: 50
      max-content-per-user: 100
    
    async:
      core-pool-size: 2
      max-pool-size: 5
      queue-capacity: 100
      thread-name-prefix: "ai-generation-"